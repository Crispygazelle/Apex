[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex"
version = "0.1.0"
description = "Edge telemetry and voice assistant node for motorcycle helmets"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Runs anywhere, including a laptop with no sensors attached.
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "influxdb-client>=1.40",
]

[project.optional-dependencies]
# Hardware-only. These wheels need a Raspberry Pi (or at least Linux).
pi = [
    "smbus2>=0.4.2",
    "pyserial>=3.5",
    "pynmea2>=1.19",
    "pyaudio>=0.2.13",
    "gpiozero>=2.0",
    "lgpio>=0.2.2",
]
# Offline speech. Kept separate because the models are large.
voice = [
    "vosk>=0.3.45",
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
apex = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.dashboard" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
